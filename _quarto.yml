project:
  type: book
  output-dir: _book

book:
  title: "Sistemas Embarcados I - UFU"

  navbar:
    logo: shared/images/logo-ufu.svg
    search: true
    collapse: true
    right:
      - icon: github
        href: https://github.com/daniel-p-carvalho/ufu-embedded-systems
        aria-label: GitHub Repository

  chapters:
    - index.qmd
    - part: "Módulo 1 — Fundamentos e Toolchain"
      chapters:
        - modulo-01/o-que-e-sistema-embarcado.qmd
        - modulo-01/arquitetura-computadores.qmd
        - modulo-01/introducao-desenvolvimento-embarcado.qmd
        - modulo-01/memoria-registradores.qmd
        - modulo-01/atividade-avaliativa-01.qmd
        - modulo-01/linux-basico.qmd
        - modulo-01/index.qmd
    - part: "Módulo 2 — Clocks e GPIO"
    - part: "Módulo 3 — Temporização e Comunicação Serial"
    - part: "Módulo 4 — Barramentos de Sensor e DMA"
    - part: "Módulo 5 — Baixo Consumo, Hardware e Projeto Integrador"
      chapters:
        - modulo-05/index.qmd

  page-footer:
    left: |
      **Sistemas Embarcados I** - Faculdade de Engenharia de Controle e Automação (FEELT)
    center: |
      Universidade Federal de Uberlândia
    right: |
      © 2026 [Daniel P. Carvalho](https://github.com/daniel-p-carvalho)  
      *Licença Creative Commons BY-NC-SA*
    border: true

format:
  html:
    theme: cosmo
    css:
      - styles.css
      - shared/webex/webex.css
    include-after-body: shared/webex/webex.js
    toc: true
    toc-expand: true
    number-sections: true
    dark-mode: false